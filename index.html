<style id="site-css">
/* Layout: sticky scoreboard-black header over a pride stripe; a scoreboard panel is the one bold object, everything else sits on plain rules. */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --ink: #15171f;
  --muted: #5a5f6e;
  --line: #d9dce4;
  --accent: #c4471a;
  --accent-ink: #ffffff;
  --board: #14161d;
  --board-2: #1f222b;
  --board-ink: #f2f3f6;
  --board-muted: #9097a6;
  --led: #ffb23e;
  --win: #1d7f47;
  --loss: #b3313a;
  --warn: #9a6a00;
  --focus: #2f6fde;
  --icon-stroke: #15171f;
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1116; --surface: #171a21; --ink: #eceef2; --muted: #9aa0ad; --line: #2a2e38;
    --accent: #ff7b3d; --accent-ink: #1a0d05; --board: #08090c; --board-2: #15171d; --board-ink: #f2f3f6;
    --board-muted: #8a91a0; --led: #ffb23e; --win: #4cc27f; --loss: #f06b72; --warn: #e2b04a; --focus: #7aa7ff;
    --icon-stroke: #e6e8ee;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1116; --surface: #171a21; --ink: #eceef2; --muted: #9aa0ad; --line: #2a2e38;
  --accent: #ff7b3d; --accent-ink: #1a0d05; --board: #08090c; --board-2: #15171d; --board-ink: #f2f3f6;
  --board-muted: #8a91a0; --led: #ffb23e; --win: #4cc27f; --loss: #f06b72; --warn: #e2b04a; --focus: #7aa7ff;
  --icon-stroke: #e6e8ee;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--board); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.05; text-wrap: balance; margin: 0; letter-spacing: .01em; }
h2 { font-size: clamp(1.7rem, 3.6vw, 2.3rem); text-transform: uppercase; }
h3 { font-size: 1.3rem; text-transform: uppercase; }
p { margin: 0; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; }
.eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.ico { width: 1.35em; height: 1.35em; flex: none; color: var(--icon-stroke); overflow: visible; object-fit: contain; }
img.ico { vertical-align: middle; }
.ico.lg { width: 52px; height: 52px; }

/* Header */
.top { position: sticky; isolation: isolate; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--board); color: var(--board-ink); --icon-stroke: var(--board-ink); }
.top-in { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; }
.brand svg, .brand img { width: 36px; height: 36px; flex: none; }
.brand-name { font-family: var(--display); font-weight: 800; font-size: 1.25rem; text-transform: uppercase; letter-spacing: .03em; line-height: 1; }
.brand-name small { display: block; font-size: .7rem; font-weight: 600; letter-spacing: .14em; color: var(--board-muted); margin-top: 3px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; margin-left: auto; scrollbar-width: none; max-width: 100%; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { font-family: var(--display); font-weight: 600; font-size: 1.02rem; text-transform: uppercase; letter-spacing: .05em; text-decoration: none; padding: 6px 11px; border-radius: 6px; color: var(--board-muted); white-space: nowrap; }
.tabs a:hover { color: var(--board-ink); background: var(--board-2); }
.tabs a[aria-current="page"] { color: var(--board-ink); background: var(--board-2); box-shadow: inset 0 -2px 0 var(--led); }
.org-btn { font: 600 .82rem var(--body); color: var(--board-ink); background: transparent; border: 1px solid var(--board-muted); border-radius: 999px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
.acct-btn { display: inline-flex; align-items: center; gap: 8px; font: 600 .82rem var(--body); color: #1a1205; background: var(--led); border: 1px solid var(--led); border-radius: 999px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
.acct-btn.in { background: transparent; color: var(--board-ink); border-color: var(--board-muted); padding: 3px 12px 3px 3px; }
.avatar { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--led); color: #1a1205; font: 700 .7rem var(--body); }
.top-btns { display: flex; gap: 8px; align-items: center; }
.signin-pop { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(100% + 8px); width: min(340px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); --icon-stroke: var(--ink); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 18px 40px -18px rgba(0,0,0,.55); padding: 16px; display: grid; gap: 12px; z-index: 6; }
.signin-pop h3 { font-size: 1.2rem; }
.signin-pop p { font-size: .9rem; color: var(--muted); }
.acct-choice { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.acct-choice:hover { border-color: var(--muted); }
.acct-choice small { display: block; color: var(--muted); font-size: .78rem; }
.test-tag { font-size: .66rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--warn); border: 1px solid currentColor; border-radius: 999px; padding: 1px 7px; }
.mygyms { border: 1.5px solid var(--win); background: color-mix(in srgb, var(--win) 9%, var(--surface)); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 8px; }
.mygyms b { font-weight: 700; }
.demo-hint { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; border: 1px dashed var(--muted); border-radius: var(--radius); padding: 10px 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-family: var(--display); font-weight: 600; font-size: .98rem; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 1px 8px; }
.mygyms .chips span { border-color: color-mix(in srgb, var(--win) 50%, var(--line)); }
.slot.mine { cursor: default; border-color: var(--win); background: color-mix(in srgb, var(--win) 13%, var(--surface)); }
.slot.mine .sub { color: var(--win); font-size: .68rem; letter-spacing: .04em; }
.slot.mine::before { content: "✓"; position: absolute; top: 3px; right: 6px; font-size: .75rem; font-weight: 800; color: var(--win); }
.slot.mine.wl { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--surface)); }
.slot.mine.wl .sub, .slot.mine.wl::before { color: var(--warn); }
.slot.mine.wl::before { content: none; }
.slot.mine.wl .sub { margin-top: 6px; }
.org-btn[aria-pressed="true"] { background: var(--led); color: #1a1205; border-color: var(--led); }
.flag { display: grid; grid-template-columns: repeat(6, 1fr); height: 5px; }
.flag i:nth-child(1) { background: #e40303; } .flag i:nth-child(2) { background: #ff8c00; } .flag i:nth-child(3) { background: #ffed00; }
.flag i:nth-child(4) { background: #008026; } .flag i:nth-child(5) { background: #004dff; } .flag i:nth-child(6) { background: #750787; }
@media (max-width: 720px) {
  .tabs { margin-left: 0; order: 3; width: 100%; }
  .top-btns { margin-left: auto; }
}

main { padding-block: 28px 64px; }
.section { display: grid; gap: 18px; }
.section + .section { margin-top: 44px; }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.sec-head a { font-size: .9rem; font-weight: 600; color: var(--accent); text-decoration: none; }
.subnav { display: flex; gap: 6px; flex-wrap: wrap; }
.subnav a { font-weight: 600; font-size: .9rem; text-decoration: none; padding: 5px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.subnav a[aria-current="page"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.org-note { background: color-mix(in srgb, var(--led) 18%, var(--surface)); border: 1px solid color-mix(in srgb, var(--led) 55%, var(--line)); border-radius: var(--radius); padding: 10px 14px; font-size: .92rem; }

/* Buttons and fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: 600 .95rem var(--body); padding: 10px 18px; border-radius: 999px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); text-decoration: none; cursor: pointer; text-align: center; }
.btn:hover { background: var(--surface); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.sm { padding: 6px 12px; font-size: .85rem; }
.btn.danger { border-color: var(--loss); color: var(--loss); }
.btn[disabled] { cursor: default; background: var(--line); border-color: var(--line); color: var(--muted); filter: none; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; max-width: 100%; }
textarea { width: 100%; resize: vertical; line-height: 1.45; }
label.field { display: grid; gap: 4px; font-size: .82rem; font-weight: 600; color: var(--muted); }
.form-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }

/* Home hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.hero h1 { font-size: clamp(2.3rem, 5.6vw, 4rem); text-transform: uppercase; font-weight: 800; letter-spacing: 0; margin-top: 10px; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .lede { margin-top: 16px; max-width: 34em; color: var(--muted); font-size: 1.05rem; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; padding: 0; list-style: none; }
.facts li { font-size: .85rem; font-weight: 600; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; }
.cta-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
@media (max-width: 860px) { .hero { grid-template-columns: minmax(0, 1fr); } }

/* Scoreboard */
.board { background: var(--board); color: var(--board-ink); --icon-stroke: var(--board-ink); border-radius: 14px; padding: 18px 18px 14px; box-shadow: 0 1px 0 var(--line), 0 18px 40px -24px rgba(0,0,0,.6); }
.board-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--board-2); padding-bottom: 10px; }
.board-head .label { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: .85rem; color: var(--led); }
.board-head .day { font-family: var(--display); font-weight: 800; font-size: 1.7rem; text-transform: uppercase; line-height: 1; }
.board-where { font-size: .82rem; color: var(--board-muted); margin-top: 8px; }
.bd-games { list-style: none; margin: 8px 0 0; padding: 0; }
.bd-game { display: grid; grid-template-columns: 4.2rem minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--board-2); }
.bd-game:first-child { border-top: 0; }
.bd-time { font-family: var(--display); font-weight: 700; font-size: 1.5rem; color: var(--led); line-height: 1.1; font-variant-numeric: tabular-nums; }
.bd-time small { display: block; font-size: .7rem; letter-spacing: .1em; color: var(--board-muted); }
.bd-teams { display: grid; gap: 4px; }
.bd-team { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 600; }
.bd-team .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bd-team .rec { margin-left: auto; font-family: var(--display); color: var(--board-muted); font-size: .95rem; font-variant-numeric: tabular-nums; }

/* Home columns */
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; }
@media (max-width: 960px) { .cols3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .cols3 > :last-child { grid-column: 1 / -1; } }
@media (max-width: 640px) { .cols3 { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 12px; align-content: start; min-width: 0; }
.col > h3 { border-bottom: 2px solid var(--ink); padding-bottom: 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.col > h3 a { font-family: var(--body); text-transform: none; font-size: .85rem; font-weight: 600; color: var(--accent); text-decoration: none; }
.mini-table { width: 100%; border-collapse: collapse; font-size: .95rem; }
.mini-table td { padding: 6px 4px; border-bottom: 1px solid var(--line); }
.mini-table td.r { text-align: right; font-family: var(--display); font-weight: 600; font-variant-numeric: tabular-nums; }
.mini-table .rank { width: 1.6em; color: var(--muted); font-family: var(--display); }
.teamcell { display: flex; align-items: center; gap: 8px; min-width: 0; }
.results { list-style: none; margin: 0; padding: 0; }
.results li { display: grid; gap: 2px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.res-line { display: flex; align-items: center; gap: 8px; }
.res-line .sc { margin-left: auto; font-family: var(--display); font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.res-line.lost { color: var(--muted); }
.res-line.lost .sc { font-weight: 500; }
.ann { display: grid; gap: 4px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ann time { font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ann h4 { margin: 0; font-size: 1.05rem; }
.ann p { white-space: pre-line; }
.empty { color: var(--muted); font-size: .95rem; padding: 10px 0; }

/* Schedule */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
.week { display: grid; gap: 8px; scroll-margin-top: 150px; }
.week + .week { margin-top: 12px; }
.week-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.week-head h3 { font-size: 1.45rem; }
.week-head .date { font-weight: 600; color: var(--muted); }
.week.past .week-head h3 { color: var(--muted); }
.tag { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 2px 9px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
.games { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 720px) { .games { grid-template-columns: minmax(0, 1fr); } }
.game { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; grid-template-columns: 4.4rem minmax(0, 1fr); gap: 4px 12px; align-content: start; }
.week.next .game { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.g-when { font-family: var(--display); font-weight: 700; font-size: 1.2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.g-when small { display: block; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-family: var(--body); font-weight: 600; margin-top: 4px; }
.g-lines { display: grid; gap: 5px; min-width: 0; }
.g-line { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 600; }
.g-line .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-line .ha { font-size: .68rem; font-weight: 700; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.g-line .sc { margin-left: auto; font-family: var(--display); font-weight: 700; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.g-line.lost { color: var(--muted); }
.g-line.lost .sc { font-weight: 500; }
.g-line .score-in { margin-left: auto; width: 4.2em; text-align: right; padding: 3px 6px; font-family: var(--display); font-size: 1.1rem; }
.g-meta { grid-column: 2; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.pill { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
.pill.forfeit, .pill.postponed { color: var(--warn); }
.pill.canceled { color: var(--loss); }
.game.canceled .g-lines { text-decoration: line-through; opacity: .7; }
.g-tools { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 6px; }
.g-tools select, .g-tools input { padding: 4px 8px; font-size: .88rem; }
details.box { grid-column: 1 / -1; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; }
details.box summary { cursor: pointer; font-size: .85rem; font-weight: 600; color: var(--accent); }
.box-tables { display: grid; gap: 10px; margin-top: 8px; }
.box-table { width: 100%; border-collapse: collapse; font-size: .86rem; }
.box-table caption { text-align: left; font-weight: 700; padding-bottom: 2px; }
.box-table th { font-size: .7rem; letter-spacing: .06em; color: var(--muted); text-align: right; font-weight: 700; }
.box-table th:first-child, .box-table td:first-child { text-align: left; }
.box-table td { text-align: right; padding: 3px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
@media (max-width: 480px) { .game { grid-template-columns: 3.4rem minmax(0, 1fr); gap: 4px 8px; padding: 10px 12px; } .g-when { font-size: 1.05rem; } .g-line .ha { display: none; } }
.addbox { background: var(--surface); border: 1px dashed var(--muted); border-radius: var(--radius); padding: 14px; display: grid; gap: 12px; }
.addbox h3 { font-size: 1.1rem; }

/* Standings */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.standings { width: 100%; border-collapse: collapse; min-width: 560px; }
.standings th { font-size: .74rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 10px 12px; border-bottom: 2px solid var(--line); white-space: nowrap; }
.standings th:nth-child(1), .standings th:nth-child(2) { text-align: left; }
.standings td { padding: 11px 12px; border-bottom: 1px solid var(--line); text-align: right; font-family: var(--display); font-size: 1.1rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.standings tr:last-child td { border-bottom: 0; }
.standings td.t { text-align: left; font-family: var(--body); font-size: 1rem; }
.standings td.rk { text-align: left; color: var(--muted); width: 2.5em; }
.pos { color: var(--win); } .neg { color: var(--loss); }
.form { display: inline-flex; gap: 3px; vertical-align: middle; }
.form i { width: 18px; height: 18px; border-radius: 4px; font: 700 .66rem/18px var(--body); font-style: normal; text-align: center; color: #fff; }
.form i.W { background: var(--win); } .form i.L { background: var(--loss); }
.footnote { font-size: .86rem; color: var(--muted); max-width: 60em; }

/* Teams */
.teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 14px; }
.teamcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 10px; align-content: start; }

  const icon = (t, cls) => ICON_IMG[t.icon] ? `<img class="ico${cls ? ' ' + cls : ''}" src="${ICON_IMG[t.icon]}" alt="" width="144" height="144" decoding="async">` : `<svg class="ico${cls ? ' ' + cls : ''}" viewBox="0 0 24 24" fill="${esc(t.color)}" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${ICONS[t.icon] || '<circle cx="12" cy="12" r="7"/>'}</svg>`;

  /* ---------- Standings ---------- */
  function standings() {
    const rows = {};
    state.teams.forEach(t => { rows[t.id] = { t, gp: 0, w: 0, l: 0, pf: 0, pa: 0, form: [] }; });
    const games = state.games.filter(g => g.type === 'regular' && played(g)).sort(byTime);
    games.forEach(g => {
      const a = rows[g.away], h = rows[g.home]; if (!a || !h) return;
      const as = +g.as, hs = +g.hs;
      a.gp++; h.gp++; a.pf += as; a.pa += hs; h.pf += hs; h.pa += as;
      if (as > hs) { a.w++; h.l++; a.form.push('W'); h.form.push('L'); }
      else if (hs > as) { h.w++; a.l++; h.form.push('W'); a.form.push('L'); }
    });
    const h2h = (x, y) => games.reduce((n, g) => {
      const xw = (g.away === x && +g.as > +g.hs) || (g.home === x && +g.hs > +g.as);
      return n + ((g.away === x && g.home === y) || (g.away === y && g.home === x) ? (xw ? 1 : -1) : 0);
    }, 0);
    return Object.values(rows).sort((a, b) => {
      const pa = a.gp ? a.w / a.gp : 0, pb = b.gp ? b.w / b.gp : 0;
      return pb - pa || (b.pf - b.pa) - (a.pf - a.pa) || h2h(b.t.id, a.t.id) || b.pf - a.pf || a.t.name.localeCompare(b.t.name);
    });
  }
  const recordOf = id => { const r = standings().find(x => x.t.id === id); return r ? `${r.w}-${r.l}` : '0-0'; };
  function nextDay() {
    const today = todayISO();
    const up = state.games.filter(g => (g.status === 'scheduled' || g.status === 'postponed') && g.date >= today).sort(byTime);
    return up.length ? up[0].date : null;
  }
  function lastDay() {
    const done = state.games.filter(played).sort(byTime);
    return done.length ? done[done.length - 1].date : null;
  }

  /* ---------- Player stats: imported season totals plus box scores entered here ---------- */
  const KEYS = ['pts', 'reb', 'ast', 'stl', 'blk'];
  const CATS = [['pts', 'Points per game'], ['reb', 'Rebounds per game'], ['ast', 'Assists per game'], ['stl', 'Steals per game'], ['blk', 'Blocks per game']];
  const lineHas = l => KEYS.some(k => l[k] !== null && l[k] !== '' && l[k] !== undefined);
  function playerStats(excl) {
    const map = {};
    state.players.forEach(p => { const b = p.base || {}; map[p.id] = { p, gp: b.gp || 0, w: b.w || 0, l: b.l || 0, pts: b.pts || 0, reb: b.reb || 0, ast: b.ast || 0, stl: b.stl || 0, blk: b.blk || 0 }; });
    Object.entries(state.box || {}).forEach(([gid, lines]) => {
      const g = state.games.find(x => x.id === gid); if (!g || !played(g)) return;
      lines.forEach(l => {
        const s = map[l.p]; if (!s || !lineHas(l)) return;
        if (excl && (side => side === 'away' ? g.away : g.home)(l.side) !== s.p.team) return;
        s.gp++; KEYS.forEach(k => { s[k] += +l[k] || 0; });
        const mine = l.side === 'away' ? +g.as : +g.hs, theirs = l.side === 'away' ? +g.hs : +g.as;
        if (mine > theirs) s.w++; else if (theirs > mine) s.l++;
      });
    });
    return Object.values(map).filter(s => !excl || s.p.team).map(s => { KEYS.forEach(k => { s[k + 'g'] = s.gp ? s[k] / s.gp : 0; }); return s; });
  }
  const minGP = () => { const max = Math.max(0, ...standings().map(r => r.gp)); return Math.max(1, Math.ceil(max * 0.4)); };
  function statsThrough() {
    let d = state.statsBase.through;
    Object.entries(state.box || {}).forEach(([gid, lines]) => { const g = state.games.find(x => x.id === gid); if (g && played(g) && lines.some(lineHas) && g.date > d) d = g.date; });
    return d;
  }

  /* ---------- Shell ---------- */
  const ball = ICON_IMG.ball ? `<img src="${ICON_IMG.ball}" alt="" width="144" height="144">` : `<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#e8601c"/><g fill="none" stroke="#1a1205" stroke-width="1.6"><circle cx="20" cy="20" r="18"/><path d="M2 20h36M20 2v36"/><path d="M7.5 7.5c5 4 5 21 0 25M32.5 7.5c-5 4-5 21 0 25"/></g></svg>`;
  function header() {
    const cur = view === 'players' ? 'stats' : view.startsWith('game-') ? 'schedule' : view.startsWith('team-') ? 'teams' : view;
    return `<header class="top"><div class="wrap gutter top-in">
      <a class="brand" href="#home">${ball}<span class="brand-name">Seattle Basketball Club<small>LGBTQIA+ league &amp; community</small></span></a>
      <nav class="tabs" aria-label="Sections">${NAV.map(([k, l]) => `<a href="#${k}"${k === cur ? ' aria-current="page"' : ''}>${l}</a>`).join('')}</nav>

    </div>${signinOpen ? signinPop() : ''}<div class="flag" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div></header>`;

  function acctButton() {

    </div>`;
  }
  function footer() {
    return `<footer class="gutter"><div class="wrap">
      <span>Seattle Basketball Club · Seattle's LGBTQIA+ basketball league since the days of Jet City Hoops.</span>
      <span>Last updated ${fmt(String(state.updated).slice(0, 10), { month: 'short', day: 'numeric', year: 'numeric' })}.</span>

  }
  function savebar() {
    return `<div class="savebar gutter" id="savebar"${dirty ? '' : ' hidden'}><div class="wrap">

  const orgNote = text => editing ? `<p class="org-note">${text}</p>` : '';

  /* ---------- Home ---------- */
  function vHome() {
    const nd = nextDay(), ld = lastDay();
    const ndGames = nd ? state.games.filter(g => g.date === nd).sort(byTime) : [];
    const weekNo = ndGames[0]?.week;

    const recent = ld ? state.games.filter(g => g.date === ld && played(g)).sort(byTime) : [];
    const ann = state.announcements || [];
    const board = nd ? `<aside class="board" aria-label="Next game day">
        <div class="board-head"><span class="label">Next up${weekNo ? ` · Week ${weekNo}` : ''}</span><span class="day">${fmt(nd, { weekday: 'long', month: 'short', day: 'numeric' })}</span></div>
        <p class="board-where">${esc(state.season.venue)} · away team listed first · records are regular season</p>
        <ol class="bd-games">${ndGames.map(g => {
          const [hh, mm] = (g.time || '').replace(/\s*(AM|PM)/i, '').split(':');

          return `<li class="bd-game"><span class="bd-time">${esc(hh)}:${esc(mm || '00')}<small>${/am/i.test(g.time) ? 'AM' : 'PM'}${g.type !== 'regular' ? ' · ' + esc(TYPE[g.type] || '') : ''}</small></span><div class="bd-teams">${line(team(g.away))}${line(team(g.home))}</div></li>`;
        }).join('')}</ol>
      </aside>` : `<aside class="board"><div class="board-head"><span class="label">${esc(state.season.name)}</span><span class="day">Season complete</span></div><p class="board-where">Thanks for a great season. Watch Announcements for what's next.</p></aside>`;
    const annList = ann.length ? ann.slice(0, editing ? ann.length : 4).map(a => `<article class="ann"><time>${fmt(a.date, { month: 'short', day: 'numeric' })}</time><h4>${esc(a.title)}</h4>${a.body ? `<p>${esc(a.body)}</p>` : ''}${editing ? `<div><button class="btn sm danger" type="button" data-act="del-ann" data-id="${esc(a.id)}">Delete</button></div>` : ''}</article>`).join('')
      : `<p class="empty">No announcements right now. Rainouts, gym changes and social events will show up here.</p>`;
    const annForm = editing ? `<div class="addbox"><h3>Post an announcement</h3>
        <label class="field" for="na-title">Headline<input id="na-title" type="text" maxlength="120" placeholder="e.g. Week 7 moves to 2:10 PM"></label>
        <label class="field" for="na-body">Details (optional)<textarea id="na-body" rows="3"></textarea></label>
        <div><button class="btn sm primary" type="button" data-act="add-ann">Add announcement</button></div></div>` : '';
    return `<div class="view">
      <section class="section hero">
        <div>
          <p class="eyebrow">${esc(state.season.name)} league${weekNo ? ` · Week ${weekNo} of ${state.season.weeks}` : ''}</p>
          <h1>Seattle's <em>LGBTQIA+</em> basketball league and community.</h1>
          <p class="lede">A welcoming, encouraging place for LGBTQIA+ people of every skill level to play ball and be in community. Everyone who shares that goal is invited to join.</p>
          <ul class="facts"><li>Teams formed by draft</li><li>8-week seasons with playoffs</li><li>Refs every game</li><li>Social events</li></ul>
          <div class="cta-row"><a class="btn primary" href="#join">Play with us</a><a class="btn" href="#schedule">Full schedule</a></div>
        </div>
        ${board}
      </section>
      <section class="section cols3">
        <div class="col"><h3>Standings <a href="#standings">Full table</a></h3>
          <table class="mini-table"><tbody>${st.map((r, i) => `<tr><td class="rank">${i + 1}</td><td><span class="teamcell">${icon(r.t)}${tlink(r.t)}</span></td><td class="r">${r.w}-${r.l}</td><td class="r ${r.pf - r.pa > 0 ? 'pos' : r.pf - r.pa < 0 ? 'neg' : ''}">${signed(r.pf - r.pa)}</td></tr>`).join('')}</tbody></table>
        </div>
        <div class="col"><h3>Latest scores <a href="#schedule">All results</a></h3>
          ${recent.length ? `<p class="small muted">${fmt(ld, { weekday: 'long', month: 'long', day: 'numeric' })}</p><ul class="results">${recent.map(g => {
            const a = team(g.away), h = team(g.home), aw = +g.as > +g.hs;
            return `<li><a class="res-link" href="#game-${esc(g.id)}" aria-label="Box score: ${esc(a.name)} ${esc(g.as)}, ${esc(h.name)} ${esc(g.hs)}"><div class="res-line${aw ? '' : ' lost'}">${icon(a)}${esc(a.name)}<span class="sc">${esc(g.as)}</span></div><div class="res-line${aw ? ' lost' : ''}">${icon(h)}${esc(h.name)}<span class="sc">${esc(g.hs)}</span></div></a></li>`;
          }).join('')}</ul>` : `<p class="empty">No games played yet.</p>`}
        </div>
        <div class="col"><h3>Announcements</h3>${annForm}${annList}</div>
      </section>
    </div>`;
  }

  /* ---------- Schedule ---------- */
  const pname = id => (state.players.find(p => p.id === id) || {}).name || 'Unknown player';
  function boxTable(g, side) {
    const t = team(side === 'away' ? g.away : g.home);
    const lines = (state.box[g.id] || []).filter(l => l.side === side && lineHas(l)).sort((a, b) => (+b.pts || 0) - (+a.pts || 0));
    if (!lines.length) return '';
    const tot = k => lines.reduce((n, l) => n + (+l[k] || 0), 0);
    return `<div class="col"><h3><span class="teamcell">${icon(t)}${tlink(t)}</span></h3><div class="tablewrap"><table class="stat-table box-full"><thead><tr>${['Player', 'PTS', 'REB', 'AST', 'STL', 'BLK'].map(x => `<th><span>${x}</span></th>`).join('')}</tr></thead>
      <tbody>${lines.map(l => `<tr><td>${esc(pname(l.p))}</td>${KEYS.map(k => `<td>${+l[k] || 0}</td>`).join('')}</tr>`).join('')}<tr><td>Team</td>${KEYS.map(k => `<td class="avg">${tot(k)}</td>`).join('')}</tr></tbody></table></div></div>`;
  }
  function vGame(id) {
    const g = state.games.find(x => x.id === id);
    const a = team(g.away), h = team(g.home), done = played(g);
    const aw = done && +g.as > +g.hs, hw = done && +g.hs > +g.as;
    const boxes = boxTable(g, 'away') + boxTable(g, 'home');
    const noBox = !done ? 'The box score will show up here after the game.'
      : g.date <= state.statsBase.through ? `There's no box score for this game. Player stats through ${fmt(state.statsBase.through, { month: 'short', day: 'numeric' })} were brought over from MyStatsOnline as season totals, so they count in each player's season stats but can't be split by game.`
      : "The box score for this game hasn't been entered yet.";
    return `<div class="view"><section class="section">
      <a class="backlink" href="#schedule">‹ Schedule</a>
      <div class="gamehead">
        <div class="gh-meta">Week ${esc(g.week)} · ${esc(TYPE[g.type] || '')} · ${fmt(g.date, { weekday: 'long', month: 'long', day: 'numeric' })} · ${esc(g.time)} · ${esc(state.season.venue)}</div>
        <div class="gh-row">
          <a class="gh-team" href="#team-${esc(a.id)}">${icon(a)}<span><span class="gh-label">Away · ${recordOf(a.id)}</span><span class="nm">${esc(a.name)}</span></span></a>
          <div class="gh-score">${done ? `<span class="${aw ? '' : 'lost'}">${esc(g.as)}</span><span class="dash"> – </span><span class="${hw ? '' : 'lost'}">${esc(g.hs)}</span>` : '<span class="lost">vs</span>'}</div>
          <a class="gh-team home" href="#team-${esc(h.id)}"><span><span class="gh-label">Home · ${recordOf(h.id)}</span><span class="nm">${esc(h.name)}</span></span>${icon(h)}</a>
        </div>
        <div class="gh-meta">${done ? (g.status === 'forfeit' ? 'Forfeit' : 'Final') : esc(STATUS[g.status] || '')}</div>
      </div>
      <h3>Box score</h3>
      ${boxes ? `<div class="cols2">${boxes}</div>` : `<p class="empty">${noBox}</p>`}
    </section></div>`;
  }
  function gameCard(g) {
    const a = team(g.away), h = team(g.home);
    const done = played(g);
    const aw = done && +g.as > +g.hs, hw = done && +g.hs > +g.as;
    const score = (key, t) => editing
      ? `<input class="score-in" type="number" min="0" inputmode="numeric" id="s-${esc(g.id)}-${key}" data-game="${esc(g.id)}" data-key="${key}" value="${g[key] ?? ''}" aria-label="${esc(t.name)} score">`
      : (done ? `<span class="sc">${esc(g[key])}</span>` : '');
    const line = (t, key, won, ha) => `<div class="g-line${done && !won ? ' lost' : ''}">${icon(t)}<span class="name">${esc(t.name)}</span><span class="ha">${ha}</span>${score(key, t)}</div>`;
    const tools = editing ? `<div class="g-tools">
        <label class="small" for="st-${esc(g.id)}">Status</label>
        <select id="st-${esc(g.id)}" data-status="${esc(g.id)}">${Object.entries(STATUS).map(([k, l]) => `<option value="${k}"${g.status === k ? ' selected' : ''}>${l}</option>`).join('')}</select>
        <label class="small" for="tm-${esc(g.id)}">Time</label>
        <input id="tm-${esc(g.id)}" type="text" size="8" data-time="${esc(g.id)}" value="${esc(g.time)}">
        <button class="btn sm danger" type="button" data-act="del-game" data-id="${esc(g.id)}" style="margin-left:auto">Delete game</button>
      </div>` : '';
    const link = !editing && done;
    return `<li class="game ${esc(g.status)}${link ? ' clickable' : ''}">
      <div class="g-when">${esc(g.time)}${g.type !== 'regular' ? `<small>${esc(TYPE[g.type] || g.type)}</small>` : ''}</div>
      <div class="g-lines">${line(a, 'as', aw, 'Away')}${line(h, 'hs', hw, 'Home')}</div>
      ${g.status !== 'scheduled' && g.status !== 'final' ? `<div class="g-meta"><span class="pill ${esc(g.status)}">${STATUS[g.status] || esc(g.status)}</span></div>` : ''}
      ${link ? `<span class="more">Box score ›</span><a class="card-link" href="#game-${esc(g.id)}" aria-label="Box score: ${esc(a.name)} ${esc(g.as)}, ${esc(h.name)} ${esc(g.hs)}"></a>` : ''}${tools}
    </li>`;
  }
  function vSchedule() {
    const nd = nextDay();
    const games = state.games.filter(g => teamFilter === 'all' || g.away === teamFilter || g.home === teamFilter).sort(byTime);
    const weeks = [];
    games.forEach(g => { let w = weeks.find(x => x.week === g.week && x.date === g.date); if (!w) weeks.push(w = { week: g.week, date: g.date, games: [] }); w.games.push(g); });
    const maxWeek = Math.max(0, ...state.games.map(g => +g.week || 0));
    const nextWeek = state.season.weeks > maxWeek ? maxWeek + 1 : null;
    const teamOpts = state.teams.map(t => `<option value="${esc(t.id)}"${teamFilter === t.id ? ' selected' : ''}>${esc(t.name)}</option>`).join('');
    const addForm = editing ? `<div class="addbox"><h3>Add a game</h3>
      <p class="small muted">Use this for playoff matchups or makeup games. Scores can be entered on the game once it's added.</p>
      <div class="form-row">
        <label class="field" for="ng-week">Week<input id="ng-week" type="number" min="1" max="20" value="${nextWeek || maxWeek || 1}" style="width:5em"></label>
        <label class="field" for="ng-date">Date<input id="ng-date" type="date"></label>
        <label class="field" for="ng-time">Time<input id="ng-time" type="text" value="3:10 PM" size="8"></label>
        <label class="field" for="ng-away">Away<select id="ng-away">${teamOpts}</select></label>
        <label class="field" for="ng-home">Home<select id="ng-home">${teamOpts}</select></label>
        <label class="field" for="ng-type">Type<select id="ng-type">${Object.entries(TYPE).map(([k, l]) => `<option value="${k}"${k === 'playoff' && nextWeek === state.season.weeks ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
        <button class="btn sm primary" type="button" data-act="add-game">Add game</button>
      </div><p class="small" id="ng-msg" role="status"></p></div>` : '';
    return `<div class="view">
      <section class="section">
        <div class="sec-head"><h2>Schedule &amp; scores</h2><span class="muted small">${esc(state.season.name)} · ${esc(state.season.day)} at ${esc(state.season.venue)}</span></div>
        ${orgNote('Type final scores into the boxes. Entering both scores marks a game Final. Use Status for forfeits, postponements and cancellations, then press <b>Publish changes</b>. Player stats for a game go in under Stats › All players.')}
        <div class="toolbar"><label class="field" for="team-filter">Show games for<select id="team-filter"><option value="all">All teams</option>${teamOpts}</select></label>
          ${nd ? `<button class="btn sm" type="button" data-act="jump-next">Jump to this week</button>` : ''}</div>
        ${addForm}
        ${weeks.map(w => `<div class="week${w.date === nd ? ' next' : ''}${nd && w.date < nd ? ' past' : ''}">
          <div class="week-head"><h3>Week ${esc(w.week)}</h3><span class="date">${fmt(w.date, { weekday: 'long', month: 'short', day: 'numeric' })}</span>${w.date === nd ? '<span class="tag">This week</span>' : ''}</div>
          <ol class="games">${w.games.map(gameCard).join('')}</ol></div>`).join('') || '<p class="empty">No games match this filter.</p>'}
        ${nextWeek ? `<div class="week"><div class="week-head"><h3>Week ${nextWeek}</h3><span class="date">${nextWeek === state.season.weeks ? 'Playoffs' : 'To be scheduled'}</span></div><p class="empty">${nextWeek === state.season.weeks ? 'Playoff matchups are set once the regular season wraps.' : 'Schedule coming soon.'}</p></div>` : ''}
      </section></div>`;
  }
  function jumpToNext(smooth) {
    const el = document.querySelector('.week.next');
    if (el) el.scrollIntoView({ block: 'start', behavior: smooth && !matchMedia('(prefers-reduced-motion: reduce)').matches ? 'smooth' : 'auto' });
  }

  /* ---------- Standings ---------- */
  function vStandings() {
    const st = standings();
    return `<div class="view"><section class="section">
      <div class="sec-head"><h2>Standings</h2><span class="muted small">${esc(state.season.name)} regular season · updates the moment a score is published</span></div>
      <div class="tablewrap"><table class="standings">
        <thead><tr><th>#</th><th>Team</th><th>GP</th><th>W</th><th>L</th><th>PCT</th><th>PF</th><th>PA</th><th>Diff</th><th>Last 5</th></tr></thead>
        <tbody>${st.map((r, i) => { const d = r.pf - r.pa; return `<tr>
          <td class="rk">${i + 1}</td><td class="t"><span class="teamcell">${icon(r.t)}${tlink(r.t)}</span></td>
          <td>${r.gp}</td><td>${r.w}</td><td>${r.l}</td><td>${pct(r.w, r.gp)}</td><td>${r.pf}</td><td>${r.pa}</td>
          <td class="${d > 0 ? 'pos' : d < 0 ? 'neg' : ''}">${signed(d)}</td>
          <td><span class="form">${r.form.slice(-5).map(f => `<i class="${f}" title="${f === 'W' ? 'Win' : 'Loss'}">${f}</i>`).join('')}</span></td></tr>`; }).join('')}</tbody>
      </table></div>
      <p class="footnote">Ties in the standings are broken by point differential first, then head-to-head result, then total points scored. Playoff games don't count toward these records.</p>
    </section></div>`;
  }

  /* ---------- Teams ---------- */
  const lastName = n => n.split(' ').slice(-1)[0];
  const captainOf = t => t.captain ? pname(t.captain) : '';
  function vTeams() {
    const st = standings();
    const subs = state.players.filter(p => !p.team);
    return `<div class="view"><section class="section">
      <div class="sec-head"><h2>Teams</h2><span class="muted small">${state.teams.length} teams, drafted for fair play</span></div>
      ${orgNote('Open a team to set its captain. To move or add a player, go to Stats › All players &amp; teams.')}
      <div class="teams">${st.map((r, i) => `<a class="teamcard compact" href="#team-${esc(r.t.id)}">
          <header>${icon(r.t, 'lg')}<div><h3>${esc(r.t.name)}</h3><p class="cap">Captain: ${esc(captainOf(r.t)) || 'TBA'}</p></div></header>
          <div class="rec"><b>${r.w}-${r.l}</b><span class="muted small">${ordinal(i + 1)} place</span></div>
        </a>`).join('')}</div>
      ${subs.length ? `<p class="footnote"><b>Subs this season:</b> ${subs.map(p => esc(p.name)).join(', ')}.</p>` : ''}
    </section></div>`;
  }
  function vTeam(id) {
    const t = team(id), st = standings();
    const r = st.find(x => x.t.id === id), rank = st.indexOf(r) + 1, gp = r.gp || 1;
    const games = state.games.filter(g => g.away === id || g.home === id).sort(byTime);
    const nd = nextDay();
    const maxWeek = Math.max(0, ...state.games.map(g => +g.week || 0));
    const nextWeek = state.season.weeks > maxWeek ? maxWeek + 1 : null;
    const roster = state.players.filter(p => p.team === id);
    const capSel = editing ? `<label class="field" for="cap-${esc(id)}">Captain<select id="cap-${esc(id)}" data-captain="${esc(id)}"><option value="">TBA</option>${roster.slice().sort((a, b) => a.name.localeCompare(b.name)).map(p => `<option value="${p.id}"${t.captain === p.id ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>` : `<p class="cap">Captain: ${esc(captainOf(t)) || 'TBA'}</p>`;
    const rows = games.map(g => {
      const home = g.home === id, opp = team(home ? g.away : g.home), done = played(g);
      const mine = home ? +g.hs : +g.as, theirs = home ? +g.as : +g.hs;
      const res = done ? `<span class="${mine > theirs ? 'W' : 'L'}">${mine > theirs ? 'W' : 'L'}</span> ${mine}–${theirs}`
        : g.status === 'scheduled' ? esc(g.time) : esc(STATUS[g.status] || '');
      const inner = `<span class="when"><b>Week ${esc(g.week)}</b>${fmt(g.date)}${g.date === nd && !done ? '<small class="tw">This week</small>' : ''}</span><span class="opp">${home ? 'vs' : 'at'} ${icon(opp)}<span class="nm">${esc(opp.name)}</span></span><span class="res">${res}</span>`;
      return `<li>${done ? `<a href="#game-${esc(g.id)}" aria-label="Box score: ${home ? 'vs' : 'at'} ${esc(opp.name)}, ${mine} to ${theirs}">${inner}</a>` : `<div class="row">${inner}</div>`}</li>`;
    }).join('') + (nextWeek ? `<li><div class="row"><span class="when"><b>Week ${nextWeek}</b>${nextWeek === state.season.weeks ? 'Playoffs' : 'TBA'}</span><span class="opp muted">${nextWeek === state.season.weeks ? 'Matchups set after the regular season' : 'Schedule coming soon'}</span><span class="res"></span></div></li>` : '');
    const th = ([k, l]) => `<th${sortKey === k ? ` aria-sort="${sortDir < 0 ? 'descending' : 'ascending'}"` : ''}><button type="button" data-sort="${k}">${l}</button></th>`;
    return `<div class="view"><section class="section">
      <a class="backlink" href="#teams">‹ All teams</a>
      <div class="teamhead">${icon(t)}<div><h2>${esc(t.name)}</h2>${capSel}</div></div>
      <div class="teamfacts">
        <div><b>${r.w}-${r.l}</b><span>Record</span></div>
        <div><b>${ordinal(rank)}</b><span>Place</span></div>
        <div><b class="${r.pf - r.pa > 0 ? 'pos' : r.pf - r.pa < 0 ? 'neg' : ''}">${signed(r.pf - r.pa)}</b><span>Point diff</span></div>
        <div><b>${(r.pf / gp).toFixed(1)}</b><span>Points per game</span></div>
        <div><b>${(r.pa / gp).toFixed(1)}</b><span>Allowed per game</span></div>
        <div><b><span class="form">${r.form.slice(-5).map(f => `<i class="${f}">${f}</i>`).join('')}</span></b><span>Last 5</span></div>
      </div>
      <div class="section"><h3>Schedule &amp; results</h3><ul class="tsched">${rows}</ul></div>
      <div class="section"><h3>Roster &amp; season stats</h3>
        ${roster.length ? subsToggle() : ''}
        ${roster.length ? `<div class="tablewrap"><table class="stat-table" style="min-width:720px"><thead><tr>${COLS.filter(c => c[0] !== 'team').map(th).join('')}</tr></thead><tbody>${statBody(statRows(id), false)}</tbody></table></div>
        <p class="footnote">Tap a column to sort. Season stats through games of ${fmt(statsThrough(), { month: 'short', day: 'numeric' })}. ${excludeSubs ? 'Only games played for this team count.' : 'Includes games a player subbed for another team.'} Win-loss is the player's record in the games counted.</p>` : '<p class="empty">Roster not posted yet.</p>'}
      </div>
    </section></div>`;

  /* ---------- Stats ---------- */
  const statsHead = () => `<div class="sec-head"><h2>Stats</h2><nav class="subnav" aria-label="Stats pages"><a href="#stats"${view === 'stats' ? ' aria-current="page"' : ''}>Leaders</a><a href="#players"${view === 'players' ? ' aria-current="page"' : ''}>All players &amp; teams</a></nav></div>
    ${subsToggle()}`;
  const subsToggle = () => `<div class="stat-opts"><label class="switch" for="excl-subs"><input type="checkbox" id="excl-subs" role="switch"${excludeSubs ? ' checked' : ''}>Exclude subs</label>
      <span class="small muted">${excludeSubs ? 'Showing rostered players only, counting just the games they played for their own team.' : 'Includes subs and games players subbed for other teams.'}</span></div>`;
  function vStats() {
    const min = minGP();
    const q = playerStats(excludeSubs).filter(s => s.gp >= min);
    return `<div class="view"><section class="section">
      ${statsHead()}
      <p class="small muted">${esc(state.season.name)} through games of ${fmt(statsThrough(), { month: 'short', day: 'numeric' })}. Players need at least ${plural(min, 'game')} played to qualify.</p>
      <div class="leaders">${CATS.map(([k, label]) => {
        const top = q.slice().sort((a, b) => b[k + 'g'] - a[k + 'g'] || b[k] - a[k] || a.p.name.localeCompare(b.p.name)).slice(0, 5);
        return `<div class="col"><h3>${label}</h3><ol class="leader-list">${top.map(s => { const t = s.p.team ? team(s.p.team) : null;
          return `<li><span class="who"><b>${esc(s.p.name)}</b><span>${t ? icon(t) + esc(t.name) : 'Sub'}</span></span><span class="val">${s[k + 'g'].toFixed(1)}</span></li>`; }).join('')}</ol></div>`;
      }).join('')}</div>
      <p><a class="btn" href="#players">See every player's stats</a></p>
    </section></div>`;
  }
  const COLS = [['name', 'Player'], ['team', 'Team'], ['gp', 'GP'], ['pts', 'PTS'], ['ptsg', 'PPG'], ['reb', 'REB'], ['rebg', 'RPG'], ['ast', 'AST'], ['astg', 'APG'], ['stl', 'STL'], ['stlg', 'SPG'], ['blk', 'BLK'], ['blkg', 'BPG'], ['w', 'W-L']];
  function statRows(teamId) {
    let rows = playerStats(excludeSubs);
    if (teamId) rows = rows.filter(s => s.p.team === teamId);
    else {
      if (statTeam !== 'all') rows = rows.filter(s => (s.p.team || 'SUB') === statTeam);
      if (statSearch) rows = rows.filter(s => s.p.name.toLowerCase().includes(statSearch.toLowerCase()));
    }
    const val = s => sortKey === 'name' ? lastName(s.p.name) : sortKey === 'team' ? team(s.p.team).name : s[sortKey];
    return rows.sort((a, b) => { const x = val(a), y = val(b); return (typeof x === 'string' ? x.localeCompare(y) : x - y) * sortDir || a.p.name.localeCompare(b.p.name); });
  }
  function statBody(rows, showTeam = true) {
    if (!rows.length) return `<tr><td colspan="${COLS.length}" class="muted">No players match.</td></tr>`;
    return rows.map(s => { const t = s.p.team ? team(s.p.team) : null;
      const teamCell = editing ? `<select data-pteam="${esc(s.p.id)}" aria-label="Team for ${esc(s.p.name)}"><option value="">Sub</option>${state.teams.map(x => `<option value="${x.id}"${x.id === s.p.team ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}</select>`
        : `<span class="teamcell">${t ? icon(t) + esc(t.name) : '<span class="muted">Sub</span>'}</span>`;
      return `<tr><td>${esc(s.p.name)}</td>${showTeam ? `<td>${teamCell}</td>` : ''}<td>${s.gp}</td>${KEYS.map(k => `<td>${s[k]}</td><td class="avg">${s[k + 'g'].toFixed(1)}</td>`).join('')}<td>${s.w}-${s.l}</td></tr>`; }).join('');
  }
  function teamStatRows() {
    const ps = playerStats(excludeSubs);
    return standings().map(r => { const mine = ps.filter(s => s.p.team === r.t.id); const sum = k => mine.reduce((n, s) => n + s[k], 0); const gp = r.gp || 1;
      return `<tr><td><span class="teamcell">${icon(r.t)}${tlink(r.t)}</span></td><td>${r.w}-${r.l}</td><td>${r.gp}</td><td class="avg">${(r.pf / gp).toFixed(1)}</td><td>${(r.pa / gp).toFixed(1)}</td><td>${(sum('reb') / gp).toFixed(1)}</td><td>${(sum('ast') / gp).toFixed(1)}</td><td>${(sum('stl') / gp).toFixed(1)}</td><td>${(sum('blk') / gp).toFixed(1)}</td></tr>`; }).join('');
  }
  function boxEditor() {
    const opts = state.games.slice().sort(byTime).map(g => `<option value="${g.id}"${g.id === bxGame ? ' selected' : ''}>Week ${g.week} · ${fmt(g.date)} · ${esc(team(g.away).name)} at ${esc(team(g.home).name)}${(state.box[g.id] || []).some(lineHas) ? ' ✓' : ''}</option>`).join('');
    const g = state.games.find(x => x.id === bxGame);
    let body = '<p class="small muted">Pick a game to enter each player\'s line.</p>';
    if (g) {
      const lines = state.box[g.id] || [];
      const val = (pid, k) => { const l = lines.find(x => x.p === pid); return l && l[k] != null ? l[k] : ''; };
      const rowsFor = side => { const tid = side === 'away' ? g.away : g.home;
        const ids = [...new Set([...state.players.filter(p => p.team === tid).map(p => p.id), ...lines.filter(l => l.side === side).map(l => l.p)])];
        return `<tr class="team-row"><td colspan="6"><span class="teamcell">${icon(team(tid))}${esc(team(tid).name)}</span></td></tr>` + ids.map(pid => `<tr><td>${esc(pname(pid))}</td>${KEYS.map(k => `<td><input type="number" min="0" inputmode="numeric" id="bx-${g.id}-${pid}-${k}" data-bx="${g.id}|${pid}|${side}|${k}" value="${val(pid, k)}" aria-label="${esc(pname(pid))} ${k}"></td>`).join('')}</tr>`).join(''); };
      const others = state.players.filter(p => p.team !== g.away && p.team !== g.home).sort((a, b) => a.name.localeCompare(b.name));
      body = `<p class="small muted">Leave a player's row blank if they didn't play. ${played(g) ? '' : 'These stats count once the game has a final score.'}</p>
        <div class="tablewrap"><table class="bx-table"><thead><tr><th>Player</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th></tr></thead><tbody>${rowsFor('away')}${rowsFor('home')}</tbody></table></div>
        <div class="form-row"><label class="field" for="bx-sub">Add a sub<select id="bx-sub">${others.map(p => `<option value="${p.id}">${esc(p.name)}${p.team ? ' (' + esc(team(p.team).name) + ')' : ''}</option>`).join('')}</select></label>
          <label class="field" for="bx-side">Playing for<select id="bx-side"><option value="away">${esc(team(g.away).name)}</option><option value="home">${esc(team(g.home).name)}</option></select></label>
          <button class="btn sm" type="button" data-act="bx-add-sub">Add to box score</button></div>`;
    }
    return `<div class="addbox"><h3>Enter a box score</h3>
      <label class="field" for="bx-game">Game<select id="bx-game"><option value="">Choose a game…</option>${opts}</select></label>${body}</div>
      <div class="addbox"><h3>Add a player</h3><div class="form-row">
        <label class="field" for="np-name">Name<input id="np-name" type="text" placeholder="First Last"></label>
        <label class="field" for="np-team">Team<select id="np-team"><option value="">Sub</option>${state.teams.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></label>
        <button class="btn sm primary" type="button" data-act="add-player">Add player</button></div></div>`;
  }
  function vPlayers() {
    const th = ([k, l]) => `<th${sortKey === k ? ` aria-sort="${sortDir < 0 ? 'descending' : 'ascending'}"` : ''}><button type="button" data-sort="${k}">${l}</button></th>`;
    const plain = l => `<th><span>${l}</span></th>`;
    return `<div class="view"><section class="section">
      ${statsHead()}
      ${orgNote('Enter each game\'s player stats here; season totals and leaders update automatically. Change a player\'s team in the table, or add new players below.')}
      ${editing ? boxEditor() : ''}
      <div class="toolbar">
        <label class="field" for="stat-team">Team<select id="stat-team"><option value="all">All players</option>${state.teams.map(t => `<option value="${t.id}"${statTeam === t.id ? ' selected' : ''}>${esc(t.name)}</option>`).join('')}${excludeSubs ? '' : `<option value="SUB"${statTeam === 'SUB' ? ' selected' : ''}>Subs</option>`}</select></label>
        <label class="field" for="stat-search">Find a player<input id="stat-search" type="search" value="${esc(statSearch)}" placeholder="Name"></label>
        <span class="small muted">Tap a column to sort. Through games of ${fmt(statsThrough(), { month: 'short', day: 'numeric' })}.</span>
      </div>
      <div class="tablewrap"><table class="stat-table"><thead><tr>${COLS.map(th).join('')}</tr></thead><tbody id="stat-body">${statBody(statRows())}</tbody></table></div>
      <h3 style="margin-top:20px">Team stats</h3>
      <div class="tablewrap"><table class="stat-table" style="min-width:640px"><thead><tr>${['Team', 'W-L', 'GP', 'PPG', 'Opp PPG', 'RPG', 'APG', 'SPG', 'BPG'].map(plain).join('')}</tr></thead><tbody>${teamStatRows()}</tbody></table></div>
      <p class="footnote">Box scores through ${fmt(state.statsBase.imported, { month: 'short', day: 'numeric' })} were brought over from MyStatsOnline. Team rebounds, assists, steals and blocks add up the players on each roster.</p>
    </section></div>`;
  }

  /* ---------- Play (open gym and league sign-up) ---------- */
  const allSlots = () => state.openGym.sessions.flatMap(s => s.slots.map(sl => ({ ...sl, date: s.date })));
  const demoFor = sl => { const a = account(); return a && a.demoSlots && a.demoSlots[sl.id] ? a.demoSlots[sl.id] : null; };
  const left = sl => { const d = demoFor(sl); return Math.max(0, state.openGym.cap - (+((d && d.taken != null) ? d.taken : sl.taken) || 0)); };
  function slotButton(sl) {
    const a = account(), mine = a && a.registrations ? a.registrations[sl.id] : null;
    if (mine) return `<button type="button" class="slot mine${mine === 'waitlist' ? ' wl full' : ''}" aria-disabled="true" aria-label="${esc(`${fmt(sl.date)} ${sl.time}, ${mine === 'waitlist' ? 'you are on the wait list' : 'you are registered'}`)}"><span class="t">${esc(sl.time)}</span><span class="sub">${mine === 'waitlist' ? 'Waitlist' : 'Registered'}</span></button>`;
    const l = left(sl), full = l === 0, on = picked.has(sl.id);
    const sub = full ? '<span class="sub">Waitlist</span>' : l <= 3 ? `<span class="sub hot">${l} spot${l === 1 ? '' : 's'} left!</span>` : '';
    const label = `${fmt(sl.date)} ${sl.time}${full ? ', full, join the wait list' : `, ${l} spots left`}`;
    return `<button type="button" class="slot${full ? ' full' : ''}" data-slot="${esc(sl.id)}" aria-pressed="${on}" aria-label="${esc(label)}"><span class="t">${esc(sl.time)}</span>${sub}</button>`;
  }
  function slotEditor(sl) {
    return `<div class="slot-edit"><b>${esc(sl.time)}</b><label for="tk-${sl.id}">Signed up</label><input id="tk-${sl.id}" type="number" min="0" data-og="${sl.id}|taken" value="${+sl.taken || 0}"><label for="wl-${sl.id}">Wait list</label><input id="wl-${sl.id}" type="number" min="0" data-og="${sl.id}|waitlist" value="${+sl.waitlist || 0}"></div>`;
  }
  function vJoin() {
    const og = state.openGym, today = todayISO();
    const upcoming = og.sessions.filter(s => s.date >= today);
    const acct = account(), myRegs = acct ? acct.registrations || {} : {};
    const sel = allSlots().filter(sl => picked.has(sl.id) && sl.date >= today && !myRegs[sl.id]);
    const mine = allSlots().filter(sl => myRegs[sl.id] && sl.date >= today);
    const myBox = acct && !editing ? `<div class="mygyms"><span>Signed in as <b>${esc(acct.name)}</b>${acct.test ? ' <span class="test-tag">Test account</span>' : ''}</span>${acct.demoSlots ? '<span class="small muted">Demo: some sessions show sample sign-up numbers so you can see the "spots left" and full states.</span>' : ''}
      ${mine.length ? `<span class="small">${(n => n ? `You're booked for ${plural(n, 'upcoming open gym')}` : 'No open gyms booked')(mine.filter(sl => myRegs[sl.id] === 'registered').length)}${(n => n ? ` and on the wait list for ${n}` : '')(mine.filter(sl => myRegs[sl.id] === 'waitlist').length)}:</span><span class="chips">${mine.map(sl => `<span>${fmt(sl.date, { month: 'short', day: 'numeric' })} · ${esc(sl.time)}${myRegs[sl.id] === 'waitlist' ? ' (wait list)' : ''}</span>`).join('')}</span>` : '<span class="small">You aren\'t signed up for any upcoming open gyms yet.</span>'}</div>` : '';
    const paid = sel.filter(sl => left(sl) > 0), wait = sel.filter(sl => left(sl) === 0);
    const n = sel.length;
    const regBar = `<div class="reg-bar"><button class="btn primary" type="button" data-act="og-register"${n ? '' : ' disabled'}>${n ? `Register for my ${plural(n, 'selected open gym time')}` : 'Pick the times you want above'}</button>
      ${n ? `<span class="small muted">${paid.length ? `$${paid.length * og.price} for ${plural(paid.length, 'session')}` : ''}${paid.length && wait.length ? ' · ' : ''}${wait.length ? `${plural(wait.length, 'wait list spot')}, no charge unless a spot opens` : ''}</span>` : ''}</div>`;
    const checkoutBox = checkout && n ? `<div class="checkout" id="checkout"><h3>Your open gym times</h3>
        <ul>${sel.map(sl => `<li><span>${fmt(sl.date, { weekday: 'short', month: 'short', day: 'numeric' })} · ${esc(sl.time)}</span><span>${left(sl) ? `$${og.price}` : 'Wait list'}</span></li>`).join('')}</ul>
        <div class="total"><span>Total due now</span><span>$${paid.length * og.price}</span></div>
        <a class="btn primary" href="${esc(state.links.openGym)}" target="_blank" rel="noopener">Continue to payment</a>
        <button class="btn sm" type="button" data-act="og-back">Change my times</button></div>` : '';
    return `<div class="view">
      <section class="section">
        <div class="sec-head"><h2>Come play</h2><span class="muted small">All skill levels welcome. We'll help you learn the game.</span></div>
        <div class="split">
          <div class="prose">
            <p class="eyebrow">League play</p>
            <h3>Join a season</h3>
            <p>Our leagues run year-round in 8-week seasons that end with playoffs. You sign up as an individual and teams are drafted, so every team has a fair mix of experience. Every game has referees and league admins, and there are social events through the season.</p>
            <ul><li>LGBTQ+ and allies league</li><li>Teams created by draft</li><li>8-week season including playoffs</li><li>Referees and administrators</li><li>Social events</li></ul>
            <div class="cta-row"><a class="btn primary" href="${esc(state.links.leagues)}" target="_blank" rel="noopener">Register for the next season</a></div>
          </div>
          <div class="prose" style="max-width:none">
            <p class="eyebrow">Open gym</p>
            <h3>Saturday mornings</h3>
            <dl class="kv"><dt>Where</dt><dd>${esc(og.venue)}<br><span class="muted">${esc(og.address)}</span></dd>
              <dt>Cost</dt><dd>$${esc(og.price)} per 1-hour session</dd>
              <dt>Size</dt><dd>Up to ${esc(og.cap)} players per session. Full sessions have a wait list.</dd>
              <dt>Can't make it?</dt><dd>Give 24 hours' notice and we'll give you site credit.</dd></dl>
            ${orgNote('Enter how many people have signed up for each hour and how many are on the wait list. A session shows as full at ' + og.cap + '.')}
            ${myBox}${!acct && !editing && (state.accounts || []).some(a => a.test) ? `<div class="demo-hint"><span class="small">Want to see what a signed-in player sees? Try the demo account.</span><button class="btn sm" type="button" data-act="signin-as" data-id="${esc(state.accounts.find(a => a.test).id)}">Try the demo as ${esc(state.accounts.find(a => a.test).name)}</button></div>` : ''}
            ${upcoming.length ? `<p class="small muted">${editing ? '' : 'Tap the hours you want to play.'}</p><ul class="sessions">${upcoming.map(s => `<li><span class="d">${fmt(s.date, { weekday: 'short', month: 'short', day: 'numeric' })}${s.note ? `<small>${esc(s.note)}</small>` : ''}</span><div class="slots">${s.slots.map(editing ? slotEditor : slotButton).join('')}</div></li>`).join('')}</ul>` : '<p class="empty">No open gyms on the calendar right now.</p>'}
            ${editing || !upcoming.length ? '' : regBar + checkoutBox}
          </div>
        </div>
      </section>
      <section class="section">
        <div class="sec-head"><h2>Questions</h2></div>
        <div class="prose"><p>Email the league and someone from the board will get back to you.</p>
          <p class="copyline"><code id="mail-admin">admin@seattlebasketballclub.org</code><button class="btn sm" type="button" data-act="copy" data-target="mail-admin">Copy</button></p></div>
      </section>
    </div>`;
  }

  /* ---------- About ---------- */
  function vAbout() {
    return `<div class="view">
      <section class="section">
        <div class="sec-head"><h2>About the club</h2></div>
        <div class="split">
          <div class="prose">
            <p class="eyebrow">Mission</p>
            <p>Seattle Basketball Club is an integrated, all-inclusive organization that gives the Seattle-area LGBTQ+ community and its allies a well-organized, friendly place to play. We're committed to bringing athletes, communities and cultures together on and off the court, and to promoting health, education and community service.</p>
            <p>We want to be more than a basketball league. We want to build a community of people having fun and playing a sport they love, with leagues year-round plus tournaments and social gatherings.</p>
          </div>
          <div class="prose">
            <p class="eyebrow">Our history</p>
            <p><b>Jet City Hoops</b> brought LGBTQ+ basketball to Seattle. It grew into the largest league of its kind on the West Coast and the third largest in the country, with recreational and competitive divisions at Miller Community Center on Capitol Hill.</p>
            <p>When Miller ran out of gym time, JCH became the <b>Seattle Gay Basketball Association</b>, which played several seasons at the Asian Resource Center in Beacon Hill until that gym closed. Finding new gym space was hard as Seattle grew.</p>
            <p>A few years later the group reunited, formed a board of directors and became <b>Seattle Basketball Club</b>, built on the foundation JCH and SGBA created.</p>
          </div>
        </div>
      </section>
      <section class="section">
        <div class="sec-head"><h2>Board of directors</h2></div>
        <ul class="board-list">
          <li><b>Ted Hanson</b><span>President and League Commissioner</span><br><span class="copyline" style="margin-top:4px"><code id="mail-ted">ted@seattlebasketballclub.org</code></span></li>
          <li><b>Molly Corson</b><span>Board member</span></li>
          <li><b>Avey Menard</b><span>Board member</span></li>
          <li><b>Kelly Sagnella</b><span>Board member</span></li>
          <li><b>Paris Lillard</b><span>Board member</span></li>
          <li><b>Ashley Miller</b><span>Board member</span></li>
        </ul>
      </section>
      <section class="section">
        <div class="sec-head"><h2>Code of conduct</h2><span class="muted small">Effective March 1, 2025</span></div>
        <p class="prose">Every participant agrees to follow the Code of Conduct, on and off the court. Treat players, referees and spectators with respect; play with fair, positive sportsmanship; and try to talk issues through first, assuming positive intent.</p>
        <div class="levels">
          <div><b>Minor</b>Arguing with a ref, excessive complaining. Verbal warning, then written warning, then a one-game suspension.</div>
          <div><b>Moderate</b>Repeated verbal abuse, harassment, intimidation. Written warning and possible one-game suspension, then 2–4 games, then a season, subject to Board review.</div>
          <div><b>Severe</b>Violence, threats, extreme harassment, discrimination, property damage. Immediate suspension pending investigation; possible expulsion by Board vote.</div>
        </div>
        <details class="coc"><summary>Read the full Code of Conduct</summary><div class="prose">
          <h4>Expected behavior</h4>
          <ul><li>Treat all players, referees and spectators with respect. Treat others as you want to be treated.</li><li>Engage in fair and positive sportsmanship.</li><li>Follow league rules and the spirit of recreational play.</li><li>Take personal responsibility and try to talk through issues with others, assuming positive intent and working toward a resolution.</li><li>Report any violations or concerns to the Board of Directors promptly.</li></ul>
          <h4>Prohibited behavior</h4>
          <p>SBC has zero tolerance for behavior that threatens the integrity of the league, including:</p>
          <ul><li><b>Abuse and harassment:</b> verbal or physical abuse, including racial, ethnic, gender-based or homophobic slurs.</li><li><b>Poor sportsmanship:</b> taunting, excessive arguing with or yelling at referees or players, or refusing to comply with game officials.</li><li><b>Violence and intimidation:</b> threats of harm, physical aggression or intimidation of any kind.</li><li><b>Property damage and theft:</b> intentional destruction of equipment or personal belongings.</li><li><b>Unpaid fees:</b> not paying league fees as required.</li></ul>
          <h4>Reporting and investigation</h4>
          <ul><li>Before reporting, try to work through issues with others; the board may not see every incident.</li><li>Any participant may report a violation to the Board. Reports are handled with care and confidentiality.</li><li>The Board reviews the report, speaks with the people involved and witnesses, and decides on consequences.</li><li>Suspensions and expulsions are decided by majority vote of the Board.</li><li>Repeat offenders may be banned from future seasons at the Board's discretion.</li></ul>
          <h4>Appeals</h4>
          <ul><li>A player suspended for two or more games may submit a written appeal to the Board within seven days of notification.</li><li>The Board responds within 14 days with a final decision.</li><li>Expulsions for severe violations can't be appealed.</li><li>No refund of fees is given in cases of expulsion.</li></ul>
        </div></details>
      </section>
    </div>`;
  }

  const VIEW_FN = { home: vHome, schedule: vSchedule, standings: vStandings, teams: vTeams, stats: vStats, players: vPlayers, join: vJoin, about: vAbout };
  function render() {
    const body = view.startsWith('game-') ? vGame(view.slice(5)) : view.startsWith('team-') ? vTeam(view.slice(5)) : VIEW_FN[view]();
    app.innerHTML = header() + `<main class="gutter"><div class="wrap">${body}</div></main>` + footer() + savebar();
  }
  function go(v) {
    view = v; checkout = false; signinOpen = false; render();
    if (v === 'schedule' && document.querySelector('.week.next')) jumpToNext(false); else scrollTo(0, 0);
  }
  function markDirty() {
    dirty = JSON.stringify(state) !== JSON.stringify(saved);
    const bar = document.getElementById('savebar');
    if (bar) bar.hidden = !dirty;
  }
  function savePicked() { try { sessionStorage.setItem('sbc-picked', JSON.stringify([...picked])); } catch (e) {} }
  function toast(msg, ms) {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), ms || 3500);
  }

  /* ---------- Saving: the page republishes itself with the new data ---------- */
  function buildDoc(st) {
    const resetEl = document.head && document.head.querySelector('style');
    const reset = resetEl ? resetEl.textContent : ':root{color-scheme:light}body{margin:0}[hidden]{display:none!important}';
    const css = document.getElementById('site-css').textContent;
    const js = document.getElementById('site-js').textContent;
    const font = document.getElementById('site-fonts').getAttribute('href');
    const json = JSON.stringify(st, null, 1).replace(/</g, '\\u003c');
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>'
      + '<title>Seattle Basketball Club</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'
      + '<link id="site-fonts" rel="stylesheet" href="' + font.replace(/"/g, '&quot;') + '">\n'
      + '<style id="site-css">' + css + '</style>\n<div id="app"></div>\n'
      + '<script type="application/json" id="league-data">' + json + '<\/script>\n'
      + '<script id="site-js">' + js + '<\/script>\n</body></html>';
  }
  async function publish() {
    if (!artifactCap || busy) return;
    busy = true; render();
    const next = clone(state); next.updated = new Date().toISOString();
    try {
      await artifactCap.publish(buildDoc(next));
      saved = clone(next); state = clone(next); dirty = false; busy = false; render();
      toast('Published. Everyone with the link now sees your changes.');
    } catch (e) {
      busy = false;
      const code = e && e.code;
      if (code === 'conflict') toast('Another organizer published first, so the page is reloading with their version. Re-enter your change after it loads.', 7000);
      else if (code === 'not_writer' || code === 'not_granted') { canPublish = false; editing = false; dirty = false; state = clone(saved); toast('This account can view the site but not edit it. Ask the owner to share it with you as an Editor.', 7000); }
      else if (code === 'rate_limited') toast('Too many saves in a row. Wait a minute, then press Publish again.', 6000);
      else toast('Couldn\'t publish: ' + ((e && e.message) || 'unknown error') + '. Your changes are still here; try again.', 7000);
      render();
    }
  }

  /* ---------- Events ---------- */
  app.addEventListener('click', e => {
    if (signinOpen && !e.target.closest('.signin-pop') && !e.target.closest('[data-act="toggle-signin"]')) { signinOpen = false; render(); }
    const slot = e.target.closest('[data-slot]');
    if (slot) { const id = slot.dataset.slot; picked.has(id) ? picked.delete(id) : picked.add(id); savePicked(); checkout = false; render(); const again = document.querySelector(`[data-slot="${id}"]`); if (again) again.focus(); return; }
    const sortBtn = e.target.closest('[data-sort]');
    if (sortBtn) { const k = sortBtn.dataset.sort; if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = (k === 'name' || k === 'team') ? 1 : -1; } render(); return; }
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act;
    if (act === 'toggle-edit') { editing = !editing; render(); }
    else if (act === 'toggle-signin') { signinOpen = !signinOpen; render(); }
    else if (act === 'close-signin') { signinOpen = false; render(); }
    else if (act === 'signin-as') { me = b.dataset.id; signinOpen = false; try { localStorage.setItem('sbc-me', me); } catch (err) {} const a = account(); if (a) { Object.keys(a.registrations || {}).forEach(id => picked.delete(id)); savePicked(); } render(); toast('Signed in as ' + (a ? a.name : 'player') + '.'); }
    else if (act === 'signout') { me = null; signinOpen = false; try { localStorage.removeItem('sbc-me'); } catch (err) {} render(); toast('Signed out.'); }
    else if (act === 'publish') publish();
    else if (act === 'discard') { state = clone(saved); dirty = false; render(); toast('Changes discarded.'); }
    else if (act === 'jump-next') jumpToNext(true);
    else if (act === 'og-register') { checkout = true; render(); const c = document.getElementById('checkout'); if (c) c.scrollIntoView({ block: 'nearest' }); }
    else if (act === 'og-back') { checkout = false; render(); }
    else if (act === 'del-game') { state.games = state.games.filter(g => g.id !== b.dataset.id); if (view === 'game-' + b.dataset.id) view = 'schedule'; delete state.box[b.dataset.id]; markDirty(); render(); }
    else if (act === 'del-ann') { state.announcements = state.announcements.filter(a => a.id !== b.dataset.id); markDirty(); render(); }
    else if (act === 'add-ann') {
      const title = document.getElementById('na-title').value.trim();
      const body = document.getElementById('na-body').value.trim();
      if (!title) { document.getElementById('na-title').focus(); toast('Add a headline first.'); return; }
      state.announcements = [{ id: 'a' + Date.now().toString(36), date: todayISO(), title, body }, ...(state.announcements || [])];
      markDirty(); render();
    }
    else if (act === 'add-game') {
      const v = id => document.getElementById(id).value;
      const msg = document.getElementById('ng-msg');
      if (!v('ng-date')) { msg.textContent = 'Pick a date for the game.'; return; }
      if (v('ng-away') === v('ng-home')) { msg.textContent = 'Away and home need to be different teams.'; return; }
      state.games.push({ id: 'g' + Date.now().toString(36), week: +v('ng-week') || 1, date: v('ng-date'), time: v('ng-time').trim() || 'TBD', type: v('ng-type'), away: v('ng-away'), home: v('ng-home'), as: null, hs: null, status: 'scheduled' });
      teamFilter = 'all'; markDirty(); render(); toast('Game added. Publish to make it public.');
    }
    else if (act === 'add-player') {
      const name = document.getElementById('np-name').value.trim();
      if (!name) { document.getElementById('np-name').focus(); toast('Type the player\'s name first.'); return; }
      state.players.push({ id: 'p' + Date.now().toString(36), name, team: document.getElementById('np-team').value || null, base: { gp: 0, pts: 0, reb: 0, ast: 0, stl: 0, blk: 0, w: 0, l: 0 } });
      markDirty(); render(); toast(name + ' added.');
    }
    else if (act === 'bx-add-sub') {
      const pid = document.getElementById('bx-sub').value, side = document.getElementById('bx-side').value;
      if (!pid || !bxGame) return;
      const lines = state.box[bxGame] = state.box[bxGame] || [];
      if (!lines.some(l => l.p === pid)) lines.push({ p: pid, side, pts: null, reb: null, ast: null, stl: null, blk: null });
      render();
    }
    else if (act === 'copy') {
      const el = document.getElementById(b.dataset.target); const text = el ? el.textContent : '';
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selected. Press Cmd+C or Ctrl+C to copy.'); };
      try { navigator.clipboard.writeText(text).then(() => toast('Copied ' + text), fallback); } catch (err) { fallback(); }
    }
  });

  app.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.game) {
      const g = state.games.find(x => x.id === el.dataset.game); if (!g) return;
      g[el.dataset.key] = el.value === '' ? null : Math.max(0, Math.round(+el.value));
      const s = document.getElementById('st-' + g.id);
      if (g.as != null && g.hs != null && g.status === 'scheduled') { g.status = 'final'; if (s) s.value = 'final'; }
      if ((g.as == null || g.hs == null) && g.status === 'final') { g.status = 'scheduled'; if (s) s.value = 'scheduled'; }
      markDirty();
    } else if (el.dataset.time) {
      const g = state.games.find(x => x.id === el.dataset.time); if (g) { g.time = el.value.trim(); markDirty(); }
    } else if (el.dataset.bx) {
      const [gid, pid, side, k] = el.dataset.bx.split('|');
      const lines = state.box[gid] = state.box[gid] || [];
      let l = lines.find(x => x.p === pid);
      if (!l) { l = { p: pid, side, pts: null, reb: null, ast: null, stl: null, blk: null }; lines.push(l); }
      l[k] = el.value === '' ? null : Math.max(0, Math.round(+el.value));
      markDirty();
    } else if (el.dataset.og) {
      const [id, k] = el.dataset.og.split('|');
      const sl = state.openGym.sessions.flatMap(s => s.slots).find(x => x.id === id);
      if (sl) { sl[k] = Math.max(0, Math.round(+el.value || 0)); markDirty(); }
    } else if (el.id === 'stat-search') {
      statSearch = el.value; const body = document.getElementById('stat-body'); if (body) body.innerHTML = statBody(statRows());
    }
  });

  app.addEventListener('change', e => {
    const el = e.target;
    if (el.id === 'team-filter') { teamFilter = el.value; try { localStorage.setItem('sbc-team', teamFilter); } catch (err) {} render(); jumpToNext(false); }
    else if (el.id === 'excl-subs') { excludeSubs = el.checked; if (excludeSubs && statTeam === 'SUB') statTeam = 'all'; try { localStorage.setItem('sbc-excl', excludeSubs ? '1' : '0'); } catch (err) {} render(); const t = document.getElementById('excl-subs'); if (t) t.focus(); }
    else if (el.id === 'stat-team') { statTeam = el.value; render(); }
    else if (el.id === 'bx-game') { bxGame = el.value; render(); const s = document.getElementById('bx-game'); if (s) s.focus(); }
    else if (el.dataset.captain) { const t = state.teams.find(x => x.id === el.dataset.captain); if (t) { t.captain = el.value || null; markDirty(); } }
    else if (el.dataset.pteam) { const p = state.players.find(x => x.id === el.dataset.pteam); if (p) { p.team = el.value || null; markDirty(); } }
    else if (el.dataset.status) { const g = state.games.find(x => x.id === el.dataset.status); if (g) { g.status = el.value; markDirty(); render(); } }
    else if (el.dataset.bx) {
      const gid = el.dataset.bx.split('|')[0];
      state.box[gid] = (state.box[gid] || []).filter(lineHas);
      if (!state.box[gid].length) delete state.box[gid];
      markDirty();
    }
  });

  addEventListener('hashchange', () => { const v = pickView(); if (v !== view) go(v); });

  go(view);

  /* Organizer controls appear only for people who can publish this page. */
  (async () => {
    if (!window.claude || !window.claude.use) return;
    try {
      const [a, u] = await Promise.all([window.claude.use('artifact'), window.claude.use('user')]);
      if (!a) return;
      let ok = true;
      if (u) { try { ok = await u.canEdit(); } catch (err) { ok = true; } }
      if (ok) { artifactCap = a; canPublish = true; render(); }
    } catch (err) {}
  })();
})();
</script>
</body></html>
